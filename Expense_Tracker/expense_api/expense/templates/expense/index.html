{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- JavaScript -->
    <script src="{% static 'js/script.js' %}" defer></script>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>Expense Tracker</h1>
            <p>Track your income and manage your daily expenses.</p>
        </header>

        <!-- Dashboard Summary -->
        <section class="summary">

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p><span id="total">0.00</span></p>
            </div>

            <div class="summary-card">
                <h3>Total Records</h3>
                <p id="count">0</p>
            </div>

        </section>

        <!-- Add Expense Form -->
        <section class="panel">

            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="title">Expense Title</label>
                    <input type="text" id="title" placeholder="e.g. Grocery Shopping" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Expense Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Enter description (optional)" rows="3"></textarea>
                </div>


                <div class="form-buttons">
                    <button type="submit" id="submitBtn">Add Expense</button>
                    <button type="button" id="cancelBtn" hidden>Cancel Edit</button>
                </div>

                <p id="message" role="status" aria-live="polite"></p>


            </form>

        </section>

        <!-- Expense List -->
        <section class="panel">

            <h2>Recent Expenses</h2>

            <div class="filters">
                <input type="text" id="searchInput" placeholder="Search expense...">

                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>

                <input type="date" id="startDate" aria-label="From date" title="From date">

                <input type="date" id="endDate" aria-label="To date" title="To date">

                <button type="button" id="clearFilters" hidden>
                    Clear Filters
                </button>
            </div>

            <div id="expenses">Loading expenses...</div>

            

        </section>

    </div>

</body>

</html>
