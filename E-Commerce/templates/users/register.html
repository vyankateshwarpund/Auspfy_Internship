{% extends 'base.html' %}

{% block title %}Create an Account - Auspify Shop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-3">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Create Account</h3>
                    <p class="text-muted small">Join Auspify Shop to explore orders, track deliveries, and manage your cart.</p>
                </div>

                <form method="POST" action="{% url 'users:register' %}">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label small fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control" placeholder="John" value="{{ first_name|default:'' }}">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small fw-semibold">Last Name</label>
                            <input type="text" name="last_name" class="form-control" placeholder="Doe" value="{{ last_name|default:'' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Username <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-at"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="johndoe" required value="{{ username|default:'' }}">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="john@example.com" required value="{{ email|default:'' }}">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" name="password_confirm" class="form-control" placeholder="Re-enter password" minlength="8" required>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">
                                Create Account
                            </button>
                        </div>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">
                        Already have an account? 
                        <a href="{% url 'users:login' %}" class="fw-semibold text-primary text-decoration-none">Sign In here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
