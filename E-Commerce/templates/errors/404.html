{% extends 'base.html' %}

{% block title %}404 - Page Not Found | Auspify E-Commerce{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0 py-5 px-4 rounded-4">
                <div class="display-1 fw-bold text-primary mb-3">404</div>
                <h2 class="h3 fw-semibold mb-3">Page Not Found</h2>
                <p class="text-muted mb-4">
                    Oops! The page or product you are looking for doesn't exist or may have been moved.
                </p>
                <div>
                    <a href="/" class="btn btn-primary px-4 py-2 me-2">
                        <i class="bi bi-house-door-fill me-1"></i> Return Home
                    </a>
                    <a href="/products/" class="btn btn-outline-secondary px-4 py-2">
                        <i class="bi bi-grid-fill me-1"></i> Browse Products
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
